[tool.poetry]
name = "bz-core"
version = "1.0.0"
description = "BuyerZone Catalog Intelligence System — Telegram Ingestion Module"
authors = ["ReleaseV Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"

# Web framework
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
gunicorn = "^23.0.0"

# Telegram MTProto client
pyrogram = "^2.0.106"
tgcrypto = "^1.2.5"

# Databases
asyncpg = "^0.30.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
alembic = "^1.14.0"
psycopg2-binary = "^2.9.10"

# Vector DB
qdrant-client = "^1.12.0"

# Task queue
arq = "^0.26.1"
redis = "^5.2.0"

# ML — CLIP
torch = { version = "^2.5.0", optional = true }
torchvision = { version = "^0.20.0", optional = true }
open-clip-torch = "^2.29.0"
Pillow = "^11.0.0"
transformers = "^5.9.0"

# Storage — Cloudflare R2 (S3-compatible)
boto3 = "^1.35.0"

# Validation & serialisation
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"

# Auth
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
python-multipart = "^0.0.20"

# Utilities
httpx = "^0.28.0"
structlog = "^24.4.0"
python-dotenv = "^1.0.1"
timm = "^1.0.27"

[tool.poetry.extras]
gpu = ["torch", "torchvision"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"
ruff = "^0.8.0"
black = "^24.10.0"
mypy = "^1.13.0"
factory-boy = "^3.3.1"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
