services:

  api:
    build:
      context: ../bz-core
      dockerfile: Dockerfile
    image: bz-core:local
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -c /app/gunicorn_conf.py -w 4 -b 0.0.0.0:8000 --timeout 60 --graceful-timeout 30
    env_file: ../bz-core/.env
    ports:
      - "127.0.0.1:8000:8000"   # Only exposed to localhost — Nginx proxies externally
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    mem_limit: 3g
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  worker:
    image: bz-core:local
    command: python -m arq app.workers.arq_worker.WorkerSettings
    env_file: ../bz-core/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    deploy:
      replicas: 3
    mem_limit: 4g
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  ingestion:
    image: bz-core:local
    command: python -m app.services.ingestion
    env_file: ../bz-core/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    mem_limit: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  wa_listener:
    build:
      context: ../wa-listener
      dockerfile: Dockerfile
    restart: always
    env_file: ../bz-core/.env
    environment:
      NODE_ENV: production
      WA_INTERNAL_PORT: "3001"
      FASTAPI_INTERNAL_URL: "http://api:8000"
    expose:
      - "3001"                  # Internal only — not published to host
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  bz_admin:
    build:
      context: ../bz-admin
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "10000"
      VITE_API_TARGET: "http://api:8000"
    ports:
      - "10000:10000"              # Directly accessible via http://VPS_IP:10000
    depends_on:
      api:
        condition: service_started
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: buyerzone
      POSTGRES_USER: buyerzone
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # Bound to localhost only — use SSH tunnel to access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buyerzone"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 2g

  qdrant:
    image: qdrant/qdrant:v1.13.0
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"   # Bound to localhost only — use SSH tunnel to access
    restart: unless-stopped
    mem_limit: 2g

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle/users.yml:/data/users.yml:ro
    environment:
      DOZZLE_AUTH_PROVIDER: simple
    ports:
      - "8080:8080"
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # No ports: — not exposed to host in production
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
