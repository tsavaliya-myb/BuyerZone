name: CI/CD — bz-admin

on:
  push:
    branches: [main]
    paths:
      - 'bz-admin/**'
      - '.github/workflows/bz-admin.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bz-admin/**'
  workflow_dispatch:

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bz-admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bz-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            git pull origin main
            cd infra

            echo "Building bz_admin..."
            docker compose -f docker-compose.prod.yml build bz_admin

            echo "Restarting bz_admin..."
            docker compose -f docker-compose.prod.yml up -d --no-deps bz_admin

            docker image prune -f || true
            echo "bz-admin deployed"
