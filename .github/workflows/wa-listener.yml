name: CI — wa-listener

on:
  push:
    branches: [main]
    paths:
      - 'wa-listener/**'
      - '.github/workflows/wa-listener.yml'
  pull_request:
    branches: [main]
    paths:
      - 'wa-listener/**'
  workflow_dispatch:

jobs:
  test:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wa-listener

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: wa-listener/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Uncomment once package.json defines these scripts
      # - name: Type-check
      #   run: npm run typecheck
      # - name: Lint
      #   run: npm run lint

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            git pull origin main
            cd infra

            echo "Building wa_listener..."
            docker compose -f docker-compose.prod.yml build wa_listener

            echo "Restarting wa_listener..."
            docker compose -f docker-compose.prod.yml up -d --no-deps wa_listener

            docker image prune -f || true
            echo "wa-listener deployed"
